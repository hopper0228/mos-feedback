<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>[摩斯漢堡顧客消費滿意調查]</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #fee9e8;
      font-family: Roboto, Arial, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 12px 36px 12px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 648px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Banner Card with Red Accent Bar and MOS Burger Logo */
    .banner-card {
      background-color: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px 26px 16px;
      box-shadow: 0 1px 2px rgba(60,64,67,0.08);
    }

    /* Red accent bar on the very top card */
    .banner-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background-color: #d93025;
      border-top-left-radius: 7px;
      border-top-right-radius: 7px;
    }

    .banner-card img {
      max-width: 90%;
      width: 390px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Main Response Card */
    .content-card {
      background-color: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      padding: 24px 24px 28px 24px;
      box-shadow: 0 1px 2px rgba(60,64,67,0.08);
    }

    /* Red accent bar on top of the content card */
    .content-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background-color: #d93025;
      border-top-left-radius: 7px;
      border-top-right-radius: 7px;
    }

    .title {
      font-size: 28px;
      font-weight: 400;
      color: #202124;
      margin-top: 4px;
      margin-bottom: 16px;
      letter-spacing: 0;
      word-break: break-word;
      line-height: 1.35;
    }

    .thank-you-msg {
      font-size: 14px;
      color: #202124;
      margin-bottom: 22px;
    }

    .contact-info {
      font-size: 13.5px;
      color: #202124;
      line-height: 1.7;
      margin-bottom: 26px;
      word-break: break-all;
    }

    .contact-info a {
      color: #1a73e8;
      text-decoration: underline;
    }

    .submit-another {
      display: inline-block;
      color: #1a73e8;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }

    .submit-another:hover {
      color: #174ea6;
    }

    /* Footer styling */
    .footer {
      width: 100%;
      max-width: 648px;
      margin-top: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .footer-text {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.6;
    }

    .footer-text a {
      color: #5f6368;
      text-decoration: underline;
    }

    .google-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #5f6368;
      font-size: 21px;
      font-weight: 400;
      margin-top: 6px;
      user-select: none;
    }

    .google-branding .google-logo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      color: #5f6368;
      letter-spacing: -0.3px;
    }

    .google-branding .forms-txt {
      font-size: 20px;
      font-weight: 400;
      color: #5f6368;
    }

    /* Responsive adjustments for phones */
    @media (max-width: 600px) {
      body {
        padding: 8px 8px 30px 8px;
      }
      .content-card {
        padding: 20px 16px 24px 16px;
      }
      .title {
        font-size: 22px;
        margin-bottom: 14px;
      }
      .banner-card {
        padding: 22px 12px 18px 12px;
      }
      .banner-card img {
        width: 82%;
        max-width: 320px;
      }
      .thank-you-msg {
        font-size: 13.5px;
        margin-bottom: 18px;
      }
      .contact-info {
        font-size: 13px;
        margin-bottom: 22px;
        line-height: 1.65;
      }
      .submit-another {
        font-size: 13.5px;
      }
      .footer-text {
        font-size: 11.5px;
      }
      .google-branding {
        font-size: 19px;
      }
      .google-branding .google-logo {
        font-size: 20px;
      }
      .google-branding .forms-txt {
        font-size: 18px;
      }
    }
  </style>
</head>
